name: paper-rebalance

# Daily ETF book. Fires four times around the US close because GitHub's
# scheduler can run late; the gate inside the script decides which one counts
# and the state file stops it trading twice.
#
# US close is 20:00 UTC in summer, 21:00 UTC in winter. Slots at 19:30, 20:00,
# 20:30 and 21:00 cover the 45-minute window in both.

on:
  schedule:
    - cron: '30 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/requirements-server.txt

      - name: Install dependencies
        run: pip install -r deploy/requirements-server.txt

      - name: Kill switch
        id: kill
        run: |
          if [ -f python/output/KILL_SWITCH ]; then
            echo "engaged=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch present - doing nothing."
          else
            echo "engaged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Market gate
        id: gate
        if: steps.kill.outputs.engaged == 'false'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if python python/paper_gate.py --marker state/last-trade.txt; then
            echo "trade=true" >> "$GITHUB_OUTPUT"
          else
            echo "trade=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebalance
        if: steps.kill.outputs.engaged == 'false' && steps.gate.outputs.trade == 'true'
        working-directory: python
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NEWS_SEC_USER_AGENT: ${{ secrets.NEWS_SEC_USER_AGENT }}
        run: |
          python predict_live.py --strategy tsmom
          python execute.py --send
          python status.py

      # Runs on every slot, trading or not: the marker records the trade date,
      # and the news log is scored and committed so the next ephemeral runner
      # inherits dedupe, novelty and learned source weights.
      - name: Record state and score the news
        if: always()
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NEWS_SEC_USER_AGENT: ${{ secrets.NEWS_SEC_USER_AGENT }}
          TRADED_TODAY: ${{ steps.gate.outputs.trade }}
          KILL_ENGAGED: ${{ steps.kill.outputs.engaged }}
        run: |
          if [ "$KILL_ENGAGED" = "false" ] && [ "$TRADED_TODAY" = "true" ]; then
            mkdir -p state
            TZ=America/New_York date +%F > state/last-trade.txt
          fi
          python python/news_review.py --max-new 40 || echo "review skipped"
          git config user.name "auto-trader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/last-trade.txt ]; then git add state/last-trade.txt; fi
          if [ -d state/news ]; then git add state/news; fi
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "paper state $(TZ=America/New_York date +%F) [skip ci]" || echo "commit skipped"
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then pushed=true; break; fi
              sleep 5
            done
            [ "$pushed" = "true" ] || echo "state not pushed this run"
          fi
