name: crypto-rebalance

# 24/7 crypto sleeve. Crypto never closes, so this runs hourly with no market
# gate - only the kill switch and the position-drift band inside the script
# stand between the schedule and an order.
#
# Hourly CHECKS, daily SIGNAL. Tested: hourly signals turn over 870-2254x a
# year and lose 43-99% annually after costs (see python/fast_test.py). The
# tempo of the edge is ~30 days, so more checks only mean faster drift repair.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/requirements-server.txt

      - name: Install dependencies
        run: pip install -r deploy/requirements-server.txt

      - name: Kill switch
        id: kill
        run: |
          if [ -f python/output/KILL_SWITCH ]; then
            echo "engaged=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch present - doing nothing."
          else
            echo "engaged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebalance
        if: steps.kill.outputs.engaged == 'false'
        working-directory: python
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python crypto_bot.py --send
