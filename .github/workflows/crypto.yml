name: crypto-rebalance

# 24/7 crypto sleeve. Crypto never closes, so this runs hourly with no market
# gate - only the kill switch and the position-drift band inside the script
# stand between the schedule and an order.
#
# Hourly CHECKS, daily SIGNAL. Tested: hourly signals turn over 870-2254x a
# year and lose 43-99% annually after costs (see python/fast_test.py). The
# tempo of the edge is ~30 days, so more checks only mean faster drift repair.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/requirements-server.txt

      - name: Install dependencies
        run: pip install -r deploy/requirements-server.txt

      - name: Kill switch
        id: kill
        run: |
          if [ -f python/output/KILL_SWITCH ]; then
            echo "engaged=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch present - doing nothing."
          else
            echo "engaged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebalance
        if: steps.kill.outputs.engaged == 'false'
        working-directory: python
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NEWS_SEC_USER_AGENT: ${{ secrets.NEWS_SEC_USER_AGENT }}
        run: python crypto_bot.py --send

      # The news layer keeps a durable record across ephemeral runners: the
      # decision log feeds dedupe/novelty and the review loop, and this step
      # scores any decision whose horizon has closed since the last run.
      - name: Score the news log and persist state
        if: always()
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NEWS_SEC_USER_AGENT: ${{ secrets.NEWS_SEC_USER_AGENT }}
        run: |
          python python/news_review.py --max-new 40 || echo "review skipped"
          git config user.name "auto-trader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d state/news ]; then git add state/news; fi
          if git diff --cached --quiet; then
            echo "no news state change"
          else
            git commit -m "news state $(date -u +%FT%TZ) [skip ci]" || echo "commit skipped"
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then pushed=true; break; fi
              sleep 5
            done
            [ "$pushed" = "true" ] || echo "state not pushed this run"
          fi
