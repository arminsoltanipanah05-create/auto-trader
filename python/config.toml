# ------------------------------------------------------------
# ETF proxy panel for the futures universe in the paper.
# Liquid, long history, and available on Alpaca.
# ------------------------------------------------------------
universe = [
  "SPY",  # US large cap equity
  "QQQ",  # US tech equity
  "EFA",  # developed ex-US equity
  "EEM",  # emerging market equity
  "TLT",  # 20y+ US treasury
  "IEF",  # 7-10y US treasury
  "LQD",  # investment grade credit
  "HYG",  # high yield credit
  "GLD",  # gold
  "DBC",  # broad commodities
  "UUP",  # US dollar index
  "IYR",  # US real estate
]
start = "2008-01-01"
data_source = "auto"          # auto | local | yfinance

[signal]
lookback_days = 60            # momentum lookback
vol_window = 60               # realised vol window
vol_target_ann = 0.15         # 15% annualised, as in the paper
max_leverage = 1.0            # 2.0 only on a margin account, and not first
max_weight_per_asset = 0.25   # cap; 1/12 is 0.083 so this only binds on extremes

[costs]
cost_bps = 2.0                # per unit turnover, one way
slippage_bps = 2.0

[features]
horizons = [1, 5, 21, 63, 126, 252]
macd_fast = 8
macd_slow = 24

[model]
lstm_hidden = 64
lstm_layers = 1
dropout = 0.1
sequence_length = 63
learning_rate = 0.001
batch_size = 256
epochs = 60
turnover_penalty = 0.02       # lambda on |change in position| during training
ensemble_seeds = 5
walk_forward_start = "2015-01-01"

[execution]
paper = true                  # keep true until walk-forward is done
dry_run = true                # print orders without sending them
max_daily_loss_pct = 0.03
max_gross_exposure = 0.6      # ETF book only. Shrunk from 1.0 to free cash for
                              # the crypto sleeve, which is cash-only on Alpaca.

[pretrade]
# Mandatory gate in pre_trade.py / broker.py. Applies to every BUY and SELL.
# Setting enabled = false does NOT bypass the guard: it raises guard_disabled
# and blocks every order. Fail closed by construction.
enabled = true

max_data_age_sec = 60           # broker quote age before submit
max_market_age_sec = 180        # CoinGecko last_updated age. Measured: the public feed advances every 60-140s, so 60s blocked almost every crypto order. Execution freshness is governed by max_data_age_sec (the broker quote).
max_price_divergence_pct = 1.0  # CoinGecko vs broker mid
max_spread_bps_equity = 25.0
max_spread_bps_crypto = 100.0
max_position_pct_of_volume = 0.5   # crypto: order <= 0.5% of 24h volume
max_depth_fraction = 0.25          # equities: order <= 25% of top-of-book depth
max_risk_pct = 1.0
min_reward_risk = 2.0
max_slippage_bps = 50.0         # expected slippage alone
max_cost_bps = 100.0            # fees + expected slippage
max_gross_crypto = 0.70         # crypto sleeve ceiling, enforced in broker.py

# CoinGecko has no US-equity coverage, so only crypto is required to have a
# snapshot. Add "us_equity" here to make unmapped equity orders fail closed too.
coingecko_required_classes = ["crypto"]
coingecko_api = "https://api.coingecko.com/api/v3"

[news]
# News Intelligence Layer. It never creates a signal and never sizes a
# position: it can veto, pause, halve, confirm or boost a trade the strategy
# already produced. See python/news_intel.py and the NEWS section of AGENTS.md.
enabled = true

# required = false: a dead news feed must not stop a strategy that is otherwise
# lawful, so the run continues and logs NEWS_UNAVAILABLE. Set true to refuse all
# new risk whenever the layer is blind.
required = false

lookback_hours = 24
max_items = 250

# Materiality gates.
min_impact_to_pause = 55.0      # below this a story is advisory only
min_confidence_to_veto = 60.0
min_impact_to_veto = 60.0
priced_in_veto = 80.0           # % of the expected move already delivered
chase_move_pct = 3.0            # do not chase a move this large since publication

# Dedupe / novelty windows.
fresh_minutes = 90
dedupe_hours = 72

# Capability from the brief. Off by default: this repository is systematic, and
# a standalone event trade needs a human decision, so the agent-side cron does
# not take one on its own.
allow_standalone = false

# Operator-declared scheduled events (ISO-8601 UTC). Entries are paused inside
# this window even before the news exists.
pre_event_blackout_minutes = 60
upcoming_events = []
# Example:
# upcoming_events = [{ at = "2026-12-10T19:00:00Z", symbols = ["SPY", "QQQ"], label = "FOMC" }]

# SEC asks for a contact address; use your own. Only reaches EDGAR.
sec_user_agent = ""

# Macro releases carry no ticker, so they may only speak about these indices.
macro_proxies = ["SPY", "QQQ"]

# Tier is per feed: the Federal Reserve's own feed is Tier 1, a newspaper is not.
rss_feeds = [
  { name = "federal reserve", url = "https://www.federalreserve.gov/feeds/press_all.xml", tier = 1 },
  { name = "cnbc", url = "https://www.cnbc.com/id/100003114/device/rss/rss.html", tier = 2 },
  { name = "marketwatch", url = "http://feeds.marketwatch.com/marketwatch/topstories/", tier = 2 },
]
