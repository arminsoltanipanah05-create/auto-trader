# ------------------------------------------------------------
# ETF proxy panel for the futures universe in the paper.
# Liquid, long history, and available on Alpaca.
# ------------------------------------------------------------
universe = [
  "SPY",  # US large cap equity
  "QQQ",  # US tech equity
  "EFA",  # developed ex-US equity
  "EEM",  # emerging market equity
  "TLT",  # 20y+ US treasury
  "IEF",  # 7-10y US treasury
  "LQD",  # investment grade credit
  "HYG",  # high yield credit
  "GLD",  # gold
  "DBC",  # broad commodities
  "UUP",  # US dollar index
  "IYR",  # US real estate
]
start = "2008-01-01"
data_source = "auto"          # auto | local | yfinance

[signal]
lookback_days = 60            # momentum lookback
vol_window = 60               # realised vol window
vol_target_ann = 0.15         # 15% annualised, as in the paper
max_leverage = 1.0            # 2.0 only on a margin account, and not first
max_weight_per_asset = 0.25   # cap; 1/12 is 0.083 so this only binds on extremes

[costs]
cost_bps = 2.0                # per unit turnover, one way
slippage_bps = 2.0

[features]
horizons = [1, 5, 21, 63, 126, 252]
macd_fast = 8
macd_slow = 24

[model]
lstm_hidden = 64
lstm_layers = 1
dropout = 0.1
sequence_length = 63
learning_rate = 0.001
batch_size = 256
epochs = 60
turnover_penalty = 0.02       # lambda on |change in position| during training
ensemble_seeds = 5
walk_forward_start = "2015-01-01"

[execution]
paper = true                  # keep true until walk-forward is done
dry_run = true                # print orders without sending them
max_daily_loss_pct = 0.03
max_gross_exposure = 0.6      # ETF book only. Shrunk from 1.0 to free cash for
                              # the crypto sleeve, which is cash-only on Alpaca.

[pretrade]
# Mandatory gate in pre_trade.py / broker.py. Applies to every BUY and SELL.
# Setting enabled = false does NOT bypass the guard: it raises guard_disabled
# and blocks every order. Fail closed by construction.
enabled = true

max_data_age_sec = 60           # broker quote age before submit
max_market_age_sec = 180        # CoinGecko last_updated age. Measured: the public feed advances every 60-140s, so 60s blocked almost every crypto order. Execution freshness is governed by max_data_age_sec (the broker quote).
max_price_divergence_pct = 1.0  # CoinGecko vs broker mid
max_spread_bps_equity = 25.0
max_spread_bps_crypto = 100.0
max_position_pct_of_volume = 0.5   # crypto: order <= 0.5% of 24h volume
max_depth_fraction = 0.25          # equities: order <= 25% of top-of-book depth
max_risk_pct = 1.0
min_reward_risk = 2.0
max_cost_bps = 100.0            # fees + expected slippage

# CoinGecko has no US-equity coverage, so only crypto is required to have a
# snapshot. Add "us_equity" here to make unmapped equity orders fail closed too.
coingecko_required_classes = ["crypto"]
coingecko_api = "https://api.coingecko.com/api/v3"
